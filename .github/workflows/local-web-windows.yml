name: Local Web Windows native

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Package.swift
      - Package.resolved
      - NavPlanner/Core/**
      - NavPlanner/Resources/Web/**
      - LocalWeb/**
      - Tools/LocalWeb/build_windows_native.ps1
      - .github/workflows/local-web-windows.yml

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Swift 6.1.3
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.1.3"

      - name: Smoke authenticated FR24 host bridge
        shell: pwsh
        run: Tools/LocalWeb/test_fr24_browser_bridge.ps1

      - name: Build and smoke native Windows server
        shell: pwsh
        run: >-
          Tools/LocalWeb/build_windows_native.ps1
          -OutputDirectory "$env:RUNNER_TEMP/SimNavLocalWeb-windows-x86_64"

      - name: Run shared core and transport tests on Windows
        shell: pwsh
        run: |
          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows"
          $include = Join-Path $installed "include"
          $library = Join-Path $installed "lib"
          $env:PATH = "$(Join-Path $installed 'bin');$env:PATH"
          $testArguments = @(
            "--configuration", "release",
            "-Xcc", "-I$include",
            "-Xlinker", "/LIBPATH:$library"
          )
          $testNames = @(& swift test @testArguments list) |
            Where-Object { $_ -match "^[^.]+\.[^/]+/" }
          if ($LASTEXITCODE -ne 0) {
            throw "Swift package test discovery failed on Windows."
          }
          if ($testNames.Count -eq 0) {
            throw "Swift package test discovery returned no tests on Windows."
          }
          foreach ($testName in $testNames) {
            & swift test @testArguments --skip-build --filter $testName
            if ($LASTEXITCODE -ne 0) {
              throw "Swift package test failed on Windows: $testName"
            }
          }

      - name: Upload native bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SimNavLocalWeb-windows-x86_64
          path: ${{ runner.temp }}/SimNavLocalWeb-windows-x86_64
          if-no-files-found: error
          retention-days: 14
